[package]
name = "bonding-curve"
version = "0.1.0"
description = "Solana Anchor Bonding Curve and Fair Launchpad Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bonding_curve"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.29.0"
anchor-spl = "0.29.0"
solana-program = "=1.17.0"
spl-token = { version = "4.0.0", features = ["no-entrypoint"] }
